services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: registrybridge
      POSTGRES_USER: registrybridge
      POSTGRES_PASSWORD: registrybridge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=registrybridge --dbname=registrybridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  application:
    build:
      context: .
      dockerfile: src/RegistryBridge.Api/Dockerfile
    command: ["serve"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__RegistryBridge: Host=postgres;Port=5432;Database=registrybridge;Username=registrybridge;Password=registrybridge
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - trivy-cache:/var/lib/registrybridge/trivy
    depends_on:
      postgres:
        condition: service_healthy

  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      application:
        condition: service_healthy

volumes:
  postgres-data:
  trivy-cache:
