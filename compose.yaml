services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - registrybridge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  registrybridge:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__registrybridge: Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Deployment__TargetRegistry: ${REGISTRYBRIDGE_TARGET_REGISTRY:?Set REGISTRYBRIDGE_TARGET_REGISTRY in .env}
      Deployment__CredentialHandles__0__Name: ${REGISTRYBRIDGE_CREDENTIAL_HANDLE_NAME:?Set REGISTRYBRIDGE_CREDENTIAL_HANDLE_NAME in .env}
      Deployment__CredentialHandles__0__Type: ${REGISTRYBRIDGE_CREDENTIAL_HANDLE_TYPE:?Set REGISTRYBRIDGE_CREDENTIAL_HANDLE_TYPE in .env}
      Deployment__RetentionDays: ${REGISTRYBRIDGE_RETENTION_DAYS:-90}
      Deployment__RunLogLimitBytes: ${REGISTRYBRIDGE_RUN_LOG_LIMIT_BYTES:-10485760}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - registrybridge-trivy-cache:/root/.cache/trivy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  registrybridge-postgres:
  registrybridge-trivy-cache:
