services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  application:
    build:
      context: .
      dockerfile: src/RegistryBridge.Api/Dockerfile
    command: ["serve"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Deployment__TargetRegistry: ${REGISTRYBRIDGE_TARGET_REGISTRY:?REGISTRYBRIDGE_TARGET_REGISTRY must be set in .env}
      Deployment__CredentialHandles__0__Name: ${REGISTRYBRIDGE_CREDENTIAL_HANDLE_NAME:?REGISTRYBRIDGE_CREDENTIAL_HANDLE_NAME must be set in .env}
      Deployment__CredentialHandles__0__Type: ${REGISTRYBRIDGE_CREDENTIAL_HANDLE_TYPE:?REGISTRYBRIDGE_CREDENTIAL_HANDLE_TYPE must be set in .env}
      ConnectionStrings__RegistryBridge: "Host=postgres;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB must be set in .env};Username=${POSTGRES_USER:?POSTGRES_USER must be set in .env};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - trivy-cache:/var/lib/registrybridge/trivy
    depends_on:
      postgres:
        condition: service_healthy

  control-plane:
    build:
      context: ./src/RegistryBridge.ControlPlane
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      application:
        condition: service_healthy

volumes:
  postgres-data:
  trivy-cache:
